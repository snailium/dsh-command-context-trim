# Mock model route for an ISOLATED headless drill: no real credentials, no network
# beyond 127.0.0.1. Both rows already exist in the headless profile, so this is a row
# override — and because a patch row's `config` replaces wholesale, each supplies its
# whole config.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      mock:
        apiKeyEnv: MOCK_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8901/v1
        models:
          - id: mock-model
            contextWindow: 65536
            maxTokens: 4096
            input: [ text ]
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: mock
    model: mock-model
