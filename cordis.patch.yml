# dsh-command-context-trim bundle patch.
#
# Install into a profile:
#   dsh plugin --profile <profile> add dsh-command-context-trim
#
# The two inserts below are the plugin's two halves, each a row of its own so each can
# be switched off and tuned on its own: `context-trim` owns the trims (`/trim`, and the
# automatic trim when a request hits the model's context wall), `context-trim-tuning`
# owns when compaction fires and how hard the pruner clips. The config blocks are the
# full default sets, shown so overrides are a copy/paste away. Remove `config` entirely
# to use the built-in defaults (`lib/config.js`).
#
# Upgrading from a single-row install? The compaction knobs used to live on the
# `context-trim` row: move the five keys named below onto `context-trim-tuning`, or
# `scripts/migrate-rows.mjs` will do it and report what it changed.
- insert:
    - id: context-trim
      name: dsh-command-context-trim
      config:
        # Fraction of the usable window a trim aims for: budget =
        # floor((contextWindow - reserveOutputTokens) * targetRatio).
        targetRatio: 0.9
        # Output tokens kept available for the model's own reply.
        reserveOutputTokens: 8192
        # Recent tail kept verbatim, as a fraction of the model's context window.
        retainRatio: 0.16
        # Absolute floor for that retained tail.
        minTailTokens: 2048
        # Leading surface nodes never trimmed (the task statement).
        protectHeadNodes: 1
        # Allow the elided span to reach into the retained tail when the oldest
        # span alone cannot free enough tokens.
        allowTailTrim: true
        # Slack added to the priced replacement marker, so the post-trim request
        # stays under budget even though the marker text carries real numbers.
        markerSlackTokens: 64
        # Trim automatically when a request hits the model's context wall
        # (CONTEXT_WINDOW_EXCEEDED) instead of going straight to compaction.
        # Ordinary threshold compaction is never touched.
        autoTrim: true
        # Automatic trims allowed per overflow episode before compaction takes over.
        # More than one is needed when the declared contextWindow is larger than the
        # backend really serves: see autoTrimShrink below.
        maxAutoTrimRetries: 3
        # After a repeat overflow the target becomes this fraction of the request that
        # was just rejected (0.5 = halve it), which converges even when the declared
        # window is wrong. The first attempt still trusts the declared window.
        autoTrimShrink: 0.5
        # Before eliding any span, slim oversized tool results IN PLACE (head +
        # marker + tail), the same cheap reduction DSH's own pruner performs. Uses
        # the official `toolResultPruner` service when it is reachable and performs
        # the same transform itself when it is not (a 0.1.5 web profile hides it in
        # an agent-preset isolate realm). A span is elided only when that is not
        # enough.
        preferInPlacePrune: true
        pruneThresholdChars: 8192
        pruneHeadChars: 4096
        pruneTailChars: 1024
        # When compaction cannot recover a wall hit either (its summarization
        # failed and it left no usable surface change), take one last-resort trim
        # instead of letting the turn die. Emergency means the head-protected nodes
        # (the original task statement) may be elided too; the newest human
        # instruction is still never crossed. At most one per overflow episode.
        emergencyTrim: true
        # Off by default: when true, the plugin retunes this profile's compaction row once
        # per process, the first time the agent goes idle. Only meaningful where compaction
        # is composed on the profile plane (headless/tui); a web profile keeps it inside each
        # session's preset, so there the plugin refuses and explains instead.

# ── the compaction half ──────────────────────────────────────────────────────
# A bundle can declare more than one row, and a row is a loader entry: its own config
# namespace, its own fiber, its own switch on the Plugins page. So the two halves are
# switched and tuned independently. `role` is how one module knows which half an entry
# is, because the host hands the entry its module name, not its row id.
- insert:
    - id: context-trim-tuning
      name: dsh-command-context-trim
      config:
        role: tuning
        # Only `role` is set here, and that is deliberate. Anything written in this block is an EXPLICIT override
        # the tuning row publishes over the trim row, so writing the defaults would silently undo the compaction
        # knobs a pre-split profile still has on its `context-trim` row. The knobs and their defaults:
        #
        #   compactionTargetRatio: 0.8      # fraction of each routed window at which compaction fires
        #   compactionRoute:                # "provider:model" the generated preset summarises on
        #   autoTuneCompaction: false       # retune this profile's compaction row at runtime
        #   tuneStockDisabledRoutes: false  # also tune routes whose stock headroom disables the trigger
        #   prunerThresholdChars            # 'auto' derives it from the routed window; 0 opts out, a number overrides
        #
        # Copy one in here to override it; the values live in `lib/config.js` (DEFAULTS).
